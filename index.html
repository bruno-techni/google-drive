<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/aside.css">
    <link rel="icon" href="./assets/icon.png">
    <title>Google drive</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body>
    <header id="top-bar">
        <div class="corner-logo">
            <img src="./assets/logo.png" alt="Google drive logo">
            <span>Dysk</span>
            
        </div>
        <div class="search-box">
            <img src="./assets/search.svg" alt="search" id="search-icon">
            <input type="text" name="" id="search" placeholder="Search in drive">
            <div class="filter-div">
                <img src="./assets/filter.svg" alt="filter" id="filter-icon">
            </div>
        </div>
        <div class="header-right-buttons">
            <div class="header-r-div">
                <img src="./assets/question.svg" alt="support">
            </div>
            <div class="header-r-div">
                <img src="./assets/settings2.svg" alt="settings">
            </div>
            <div class="header-r-div">
                <img src="./assets/studio.svg" alt="studio">
            </div>
            <div class="header-r-div">
                <img src="./assets/more-apps.svg" alt="Aplikacje Google" id="more-apps">
            </div>
        </div>
        <div class="user-block">
            <img src="./assets/techni.png" alt="techni logo" id="techni-logo">
            <img src="./assets/user.png" alt="user" id="user-logo">
        </div>
    </header>
    <aside class="left-aside">
        <button id="new-button">Nowy</button>
        <br>

        <nav>
            <button>
                <img src="./assets/home.svg" alt="home icon">
                <span>Strona główna</span>
            </button>
            <button>Aktywność</button>
            <button>Obszary robocze</button>
            <br>
            <button>Mój dysk</button>
            <br>
            <button>Udostępnione</button>
            <button>Ostatnie</button>
            <button>Oznaczone gwiazdką</button>
            <br>
            <button>Spam</button>
            <button>Kosz</button>
            <button>Dane na miejsce</button>
        </nav>
    </aside>
</body>
</html>
