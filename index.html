<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/l-aside.css">
    <link rel="stylesheet" href="./style/r-aside.css">
    <link rel="stylesheet" href="./style/main.css">
    <link rel="icon" href="./assets/icon.png">
    <title>Google drive</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body>
    <header id="top-bar">
        <div class="corner-logo">
            <img src="./assets/logo.png" alt="Google drive logo">
            <span>Dysk</span>
            
        </div>
        <div class="search-box">
            <img src="./assets/search.svg" alt="search" id="search-icon">
            <input type="text" name="" id="search" placeholder="Search in drive">
            <div class="filter-div">
                <img src="./assets/filter.svg" alt="filter" id="filter-icon">
            </div>
        </div>
        <div class="header-right-buttons">
            <div class="header-r-div">
                <img src="./assets/question.svg" alt="support">
            </div>
            <div class="header-r-div">
                <img src="./assets/settings2.svg" alt="settings">
            </div>
            <div class="header-r-div">
                <img src="./assets/studio.svg" alt="studio">
            </div>
            <div class="header-r-div">
                <img src="./assets/more-apps.svg" alt="Aplikacje Google" id="more-apps">
            </div>
        </div>
        <div class="user-block">
            <img src="./assets/techni.png" alt="techni logo" id="techni-logo">
            <img src="./assets/user.png" alt="user" id="user-logo">
        </div>
    </header>
    <div class="layout">

        <aside class="left-aside">
            <button id="new-button">
                <img src="./assets/plus.svg" alt="" id="plus">
                <span>Nowy</span>
            </button>
            <br>
            <nav>
                <button>
                    <img src="./assets/home.svg" alt="home icon">
                    <span>Strona główna</span>
                </button>
                <button>
                    <img src="./assets/bell.svg" alt="bell">
                    <span>Aktywność</span>
                </button>
                <button>
                    <img src="./assets/dots.svg" alt="obszary robocze">
                    <span>Obszary robocze</span>
                </button>
                <br>
                <button>
                    <img src="./assets/drive.svg" alt="moj dysk">
                    <span>Mój dysk<span/>
                </button>
                <br>
                <button>
                    <img src="./assets/shared.svg" alt="udostepnione" >
                    <span>Udostępnione</span>
                </button>
                <button>
                    <img src="./assets/recent.svg" alt="ostatnie" style="transform: scale(1.5);">
                    <span>Ostatnie</span>
                </button>
                <button>
                    <img src="./assets/star.svg" alt="star">
                    <span>Oznaczone gwiazdką</span>
                </button>
                <br>
                <button>
                    <img src="./assets/spam.svg" alt="spam">
                    <span>Spam</span>
                </button>
                <button>
                    <img src="./assets/trash.svg" alt="trashcan">
                    <span>Kosz</span>
                </button>
                <button>
                    <img src="./assets/cloud.svg" alt="cloud">
                    <span>Dane na miejsce</span>
                </button>
            </nav>
        </aside>
    
        <main>
            <h1>Witamy na Dysku</h1>
            <button id="sug-btn">
                <img src="./assets/arrow-down.svg" alt="rozwin">
                <span>Sugerowane pliki</span>
            </button>
            <section class="pliki">
                <table>
                    <thead>
                        <tr>
                            <th scope="col" class="col1">Nazwa</th>
                            <th scope="col" class="col2">przyczyna zasugerowania</th>
                            <th scope="col" class="col3">właściciel</th>
                            <th scope="col" class="col4">Lokalizacja</th>
                        </tr>
                    </thead>
                    <tbody id="tb">
                        <tr class="rows">
                            <th scope="row">
                                <div class="cntti">
                                    <img src="./assets/file-pdf.png" alt="" class="small">
                                    <span>plik1.pdf</span>
                                </div>
                            </th>
                            <td>Otwarty przez ciebie • 11:30</td>
                            <td>
                                <div class="cntti">
                                    <img src="./assets/user.png" alt="" class="small">
                                    <span>Admin Techni Schools</span>
                                </div>
                            </td>
                            <td>
                                <div class="cntti">
                                    <img src="./assets/shared.svg" alt="" class="small">
                                    <span>Udostępnione mnie</span>
                                    <div class="table-hidden-btns-div">
                                        <img src="./assets/share.svg" alt="share" class="table-hidden-btn">
                                        <img src="./assets/download.svg" alt="download" class="table-hidden-btn">
                                        <img src="./assets/rename.svg" alt="rename" class="table-hidden-btn">
                                        <img src="./assets/star2.svg" alt="star" class="table-hidden-btn">
                                    </div>
                                    <img src="./assets/3dots.svg" alt="options" class="small table-opts">
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

        <aside class="right-aside">
            <div>
                <img src="./assets/calendar.webp" alt="calendar" class="small">
                <img src="./assets/light.webp" alt="save" class="small">
                <img src="./assets/todo.webp" alt="todo" class="small">
                <img src="./assets/contacts.webp" alt="contacts" class="small">
                <img src="./assets/plus2.svg" alt="" class="small">
            </div>
        </aside>
    </div>



    <script src="./script.js"></script>
</body>
</html
